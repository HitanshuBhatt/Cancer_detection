<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare | Lung Cancer Detection</title>
    <link rel="stylesheet" href="detection.css">

</head>
<body>

<div class="layout">
  <aside class="sidebar">
        <h2>MediCare</h2>
        <nav>
            <a href="home.html">Dashboard</a>
            <a href="patients.html">Patients</a>
            <a href="appointments.html">Appointments</a>
            <a href="detection.html" class="active">Lung Cancer Detection</a>
            <a href="login.html" class="logout-link">Logout</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="detection-container">
            <div class="header-section">
                <h1>Lung Cancer Detection</h1>
                <p style="color: #64748b; margin-bottom: 30px;">AI-assisted diagnostic analysis for lung scans.</p>
            </div>

            <div class="upload-section">
                <input type="file" id="fileInput" accept="image/*">
                <img id="preview" src="" alt="Image Preview" style="display:none;">
                
                <button class="btn-predict" onclick="uploadImage()">
                    Run Diagnostic Predictor
                </button>
            </div>

            <div id="loading" style="display:none; margin-top: 20px; color: #64748b;">
                <p>⚙️ Analyzing image patterns...</p>
            </div>

            <div id="result" style="display: none;"></div>
        </div>
    </main>
</div>

<script src="detection.js"></script>

</body>
</html>
